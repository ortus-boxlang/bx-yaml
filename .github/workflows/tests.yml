name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

env:
  MODULE_ID: ${{ github.event.repository.name }}
  GRADLE_VERSION: 8.7

jobs:
  tests:
    name: Tests ${{ github.event.repository.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest" ]
        jdkVersion: [ "21" ]
        experimental: [false]
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Test Module
        run: |
          gradle downloadBoxLang
          # this is done in order to build the module structure before testing
          gradle shadowJar test --stacktrace --console=plain

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.jdkVersion }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Inform Slack
        if: ${{ failure() && github.ref == 'refs/heads/development' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: boxlang
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "${{ env.MODULE_ID }} Tests FAILED!  You broke the build! :("
          SLACK_TITLE: "${{ env.MODULE_ID }} Build Failure"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            artifacts/**/*.xml

  #############################################
  # MatchBox native backend: one library per desktop target
  #############################################
  native:
    permissions:
      contents: read
    name: MatchBox native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # MatchBox validates plugin execution on Linux only (docs/native-plugins.md). The other targets build and run the
    # contract here, and stay non-blocking until MatchBox validates them.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, experimental: false }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, experimental: false }
          - { os: macos-15-intel, target: x86_64-apple-darwin, experimental: true }
          - { os: macos-latest, target: aarch64-apple-darwin, experimental: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, experimental: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, experimental: true }
    defaults:
      run:
        shell: bash
    env:
      # Keep in step with the matchbox-plugin-sdk rev in native/Cargo.toml and in release.yml
      MATCHBOX_REV: bfbfdf2a5aeda5b22cf9281a82e0a9c02534175a
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache MatchBox CLI
        id: matchbox-cache
        uses: actions/cache@v4
        with:
          path: ~/.matchbox-cli
          key: matchbox-cli-${{ matrix.target }}-${{ env.MATCHBOX_REV }}

      - name: Install MatchBox CLI
        if: steps.matchbox-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/ortus-boxlang/matchbox --rev ${{ env.MATCHBOX_REV }} --root ~/.matchbox-cli matchbox

      - name: Cargo tests (the reader, the writer and a round trip through both)
        run: cargo test --manifest-path native/Cargo.toml

      - name: Setup cargo-zigbuild
        if: contains(matrix.target, 'linux-gnu')
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build the module with the native plugin
        env:
          MATCHBOX_GLIBC: ${{ contains(matrix.target, 'linux-gnu') && '2.28' || '' }}
        run: |
          gradle downloadBoxLang
          gradle build -x test --stacktrace --console=plain -PmatchboxTargets=${{ matrix.target }}

      - name: Check the glibc baseline
        if: contains(matrix.target, 'linux-gnu')
        run: ./.github/scripts/check-glibc.sh build/module/native/${{ matrix.target }}/libbx_yaml_native.so 2.28

      - name: Shared contract on MatchBox
        run: ~/.matchbox-cli/bin/matchbox --module build/module native/yaml-contract.bxs

      - name: Shared contract on MatchBox (native binary)
        run: |
          ~/.matchbox-cli/bin/matchbox --target native --module build/module --output "$RUNNER_TEMP/yaml-app" native/yaml-contract.bxs
          cd "$RUNNER_TEMP" && ./yaml-app

      - name: Shared contract on the JVM
        run: |
          BOXLANG_JAR=$(ls src/test/resources/libs/boxlang-*.jar | head -1)
          java -cp "$BOXLANG_JAR" native/YamlContract.java build/module native/yaml-contract.bxs
